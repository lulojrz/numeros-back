# Si Railway inyecta la variable la usa; si no, va a tu PC
# Cambiamos por las variables nativas de Railway: MYSQLHOST, MYSQLPORT y MYSQLDATABASE
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:techlabdb}?characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:manchislindo}

# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto local por defecto
server.port=${PORT:8080}

# Permite que la cookie de sesión viaje de manera segura entre Netlify y Railway
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none


# Configuracion HikariCP (Pool de Conexiones)
# Limita a 10 las conexiones concurrentes para no saturar el servidor gratuito/barato
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# Si la DB no esta lista al arrancar, espera y reintenta en segundo plano en vez de fallar
spring.datasource.hikari.initialization-fail-timeout=-1

# Tiempo de espera maximo para conectar
spring.datasource.hikari.connection-timeout=30000

# Mantiene vivas las conexiones inactivas
spring.datasource.hikari.max-lifetime=1800000

