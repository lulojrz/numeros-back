# Si Railway inyecta la variable la usa; si no, va a tu PC
# Cambiamos por las variables nativas de Railway: MYSQLHOST, MYSQLPORT y MYSQLDATABASE
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:techlabdb}?characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD}

# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto local por defecto
server.port=${PORT:8080}

# Permite que la cookie de sesion viaje de manera segura entre Netlify y Railway
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none

# Sesiones compartidas y persistentes en MySQL; sobreviven reinicios y multiples instancias.
spring.session.jdbc.initialize-schema=always

# La sesion permanece hasta 30 dias sin actividad, incluso al cerrar el navegador.
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d

# Configuracion HikariCP (Pool de Conexiones)
# Limita a 10 las conexiones concurrentes para no saturar el servidor gratuito/barato
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# Si la DB no esta lista al arrancar, espera y reintenta en segundo plano en vez de fallar
spring.datasource.hikari.initialization-fail-timeout=-1

# Tiempo de espera maximo para conectar
spring.datasource.hikari.connection-timeout=30000

# Mantiene vivas las conexiones inactivas
spring.datasource.hikari.max-lifetime=1800000

# Detecta conexiones que no se devuelven al pool (posibles leaks) despues de 60 segundos
spring.datasource.hikari.leak-detection-threshold=60000

# VAPID keys para Web Push Notifications (usar variables de entorno en produccion)
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}
vapid.subject=mailto:admin@colegiales.com

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
server.tomcat.max-http-form-post-size=15000000
spring.jackson.deserialization.fail-on-unknown-properties=false
