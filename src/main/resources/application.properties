# Si Railway inyecta la variable la usa; si no, va a tu PC
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:techlabdb}?characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD}

# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto local por defecto
server.port=${PORT:8080}

# Configuracion JWT (30 dias = 2592000000 ms)
jwt.secret=${JWT_SECRET:ClaveSecretaSuperSeguraParaColegialesNumeros2026DebeTenerAlMenos32Caracteres}
jwt.expiration=2592000000

# Configuracion HikariCP (Pool de Conexiones)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=60000

# VAPID keys para Web Push Notifications
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}
vapid.subject=mailto:admin@colegiales.com

server.tomcat.max-http-form-post-size=15000000
spring.jackson.deserialization.fail-on-unknown-properties=false

# Supabase
supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SECRET_KEY}
supabase.bucket=territorios

# Subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Compresion GZIP de respuestas HTTP
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024